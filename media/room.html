<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{CSP_SOURCE}} data:; style-src 'nonce-{{NONCE}}'; script-src 'nonce-{{NONCE}}';">
<style nonce="{{NONCE}}">
*{box-sizing:border-box}
:root{color-scheme:light dark}
html,body{height:100%;width:100%;margin:0;overflow:hidden}
body{background:var(--vscode-sideBar-background);color:var(--vscode-foreground);font-family:var(--vscode-font-family,system-ui)}
.app{width:100%;height:100dvh;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1px 3px;gap:0}
.egg{position:relative;flex:none;width:min(100%,182px,calc((100dvh - 43px)*.868));aspect-ratio:676/779;background-image:url('{{EGG}}');background-size:100% 100%;background-position:center;background-repeat:no-repeat;image-rendering:auto}
/* Live stat bars: full-bar layers the size of the egg, revealed segment by segment with clip-path. */
.stat{position:absolute;inset:0;z-index:0;pointer-events:none;background-size:100% 100%;clip-path:inset(0 100% 0 0);transition:clip-path .45s ease}
#heartBar{background-image:url('{{BAR_HEART}}')}#waterBar{background-image:url('{{BAR_WATER}}')}
.lcd{position:absolute;left:18.9%;top:27.2%;width:61.6%;height:49.4%;overflow:hidden;container-type:inline-size;border-radius:5px;background:transparent}
/* Breathing lives on a wrapper so it layers under every reaction and pose. */
.breath{position:absolute;z-index:1;left:27.2%;top:38.5%;width:44.7%;height:53%;transform-origin:center bottom;animation:breathe 3.2s ease-in-out infinite}
.breath[data-breath=sleep]{animation-duration:4.6s;animation-name:breathe-deep}
.breath[data-breath=sob]{animation-duration:1.1s;animation-name:sob}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.028)}}
@keyframes breathe-deep{0%,100%{transform:scale(1,1)}45%{transform:scale(1.02,1.045)}}
@keyframes sob{0%,100%{transform:scale(1,1)}20%{transform:scale(1.015,1.035)}35%{transform:scale(1,1.005)}55%{transform:scale(1.012,1.03)}}
.mascot{position:absolute;inset:0;background:url('{{MASCOT}}') 0 0/600% 100% no-repeat;transform-origin:center bottom;cursor:pointer;transition:transform .6s ease,filter .6s ease}
.mascot[data-face=open]{background-position:20% 0}.mascot[data-face=blink]{background-position:40% 0}.mascot[data-face=sleep]{background-position:60% 0}.mascot[data-face=sad]{background-position:80% 0}.mascot[data-face=cry]{background-position:100% 0}
.mascot.drink{animation:drink .6s ease-in-out 3}
.mascot.feed{animation:munch .4s ease-in-out 4}
.mascot.play,.mascot.cheer{animation:hop .5s ease-in-out 3}
.mascot.rest{animation:rest 1.1s ease-in-out 2}
.mascot.wave{animation:wave .45s ease-in-out 3}
.mascot.dance{animation:dance .45s ease-in-out 4}
.mascot.worried,.mascot.cry{animation:worried .3s ease-in-out 4}
/* Tiny mood symbol by her head so happy and sleeping read differently at small sizes. */
.mood-tag{position:absolute;z-index:2;left:19%;top:30%;font-weight:900;line-height:1;pointer-events:none;opacity:0;transition:opacity .35s ease}
.mood-tag[data-face=sleep],.mood-tag[data-face=happy]{opacity:1}
.mood-tag[data-face=sleep]::after{content:'z Z';font-size:9cqw;color:#3d6fd6;letter-spacing:-.05em;text-shadow:0 0 2px #fff}
.mood-tag[data-face=happy]::after{content:'¶5';font-size:10cqw;color:#ff6f91;text-shadow:0 0 2px #fff}
.food-menu{position:absolute;z-index:5;left:50%;top:23%;transform:translateX(-50%);display:flex;gap:1px;padding:2px 3px;background:#fff7eef2;border:1px solid #eaa6b8;border-radius:6px;box-shadow:0 1px 2px #0003}
.food-menu[hidden]{display:none}
.food-menu button{border:0;background:transparent;font-size:12px;line-height:1;padding:2px;border-radius:4px;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.food-menu button:hover,.food-menu button:focus-visible{background:#ffd3df;outline:none}
.snack{position:absolute;z-index:2;left:50%;top:60%;font-size:11px;line-height:1;transform:translateX(-50%);opacity:0;pointer-events:none;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.snack.eat{animation:eat 1.7s ease-in forwards}
@keyframes eat{0%{opacity:0;transform:translate(-50%,-60%)}18%{opacity:1;transform:translate(-50%,0)}60%{opacity:1;transform:translate(-50%,0) scale(.8)}100%{opacity:0;transform:translate(-50%,0) scale(.15)}}
.mascot.lonely{transform:translateY(2%) rotate(-3deg)}
.mascot.proud{filter:brightness(1.05) drop-shadow(0 0 2px #fff8)}
.mascot.thirsty{transform:translateY(2%) rotate(-4deg);filter:saturate(.7)}
.mascot.sleepy{transform:scaleY(.96);filter:brightness(.88)}
button{cursor:pointer}
.shell-button{position:absolute;z-index:4;top:81%;height:10%;width:15%;border:0;background:transparent;border-radius:50%;padding:0;cursor:pointer}
.shell-button:focus-visible,.rest-button:focus-visible,.mascot:focus-visible{outline:2px solid var(--vscode-focusBorder,#0a93ee);outline-offset:-2px}
.shell-button:disabled{cursor:not-allowed;opacity:.55}
.feed-btn{left:26.5%}.water-btn{left:42.5%}.play-btn{left:59.5%}
.rest-button{position:absolute;top:80%;right:2%;font-size:8px;font-weight:bold;border:0;color:#255f99;background:#fff2d9c9;border-radius:3px;z-index:3;padding:1px 2px;line-height:1.1}
.status{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;font-size:10px;white-space:nowrap;line-height:1.25;padding-top:0;text-align:center}
.status b{font-size:10px}
.meter{height:4px;width:min(170px,95%);background:var(--vscode-editorWidget-border,#64748b);border-radius:9px;margin:2px 0 3px;overflow:hidden}
.meter-fill{height:100%;width:0%;background:#46b8dc;transition:width .3s ease}
.help{font-size:9px;line-height:1.1;color:var(--vscode-descriptionForeground);text-align:center;white-space:nowrap}
@keyframes drink{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes munch{0%,100%{transform:scale(1)}50%{transform:scale(1.04,.95)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes rest{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.94)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
@keyframes dance{0%,100%{transform:rotate(0)}25%{transform:translateY(-3%) rotate(-7deg)}75%{transform:translateY(-3%) rotate(7deg)}}
@keyframes worried{0%,100%{transform:translateX(0)}50%{transform:translateX(2%)}}
@media(max-height:150px){.help{display:none}.egg{width:min(100%,120px,calc((100dvh - 24px)*.868))}.status{font-size:9px}.meter{margin:1px 0}}
@media(prefers-reduced-motion:reduce){.mascot,.breath{animation:none!important;transition:none}}
</style></head><body>
<main class="app">
  <div class="egg" role="group" aria-label="Sippy's compact virtual pet">
    <div class="stat" id="heartBar"></div><div class="stat" id="waterBar"></div>
    <div class="lcd">
      <span class="mood-tag" id="moodTag" aria-hidden="true"></span>
      <div class="breath" id="breath"><div class="mascot" id="mascot" data-face="open" title="Click Sippy to wave" tabindex="0" role="button" aria-label="Wave to Sippy, a blue penguin with a teal scarf"></div></div>
      <div class="food-menu" id="foodMenu" role="menu" aria-label="Choose a snack for Sippy" hidden>
        <button role="menuitem" data-food="fish" title="Fish: very filling" aria-label="Feed fish">🐟</button>
        <button role="menuitem" data-food="shrimp" title="Shrimp: filling and tasty" aria-label="Feed shrimp">🦐</button>
        <button role="menuitem" data-food="icecream" title="Ice cream: a happy treat" aria-label="Feed ice cream">🍦</button>
      </div>
      <div class="snack" id="snack" aria-hidden="true"></div>
      <button class="rest-button" id="rest" title="Let Sippy rest" aria-label="Rest Sippy">Zz</button>
    </div>
    <button class="shell-button feed-btn" id="feed" title="Feed Sippy (choose a snack)" aria-label="Feed Sippy, opens snack menu" aria-haspopup="menu" aria-expanded="false"></button>
    <button class="shell-button water-btn" id="drink" title="Log 250 ml of water" aria-label="Log 250 ml of water"></button>
    <button class="shell-button play-btn" id="play" title="Play with Sippy" aria-label="Play with Sippy"></button>
  </div>
  <div class="status"><b id="intake">0 / 2000 ml</b> <span id="message" aria-live="polite">Hi, friend!</span></div>
  <div class="meter" role="progressbar" id="meter" aria-label="Water progress" aria-valuemin="0" aria-valuemax="2000" aria-valuenow="0"><div class="meter-fill" id="fill"></div></div>
  <div class="help">● Feed · ● Drink · ● Play · Zz Rest</div>
</main>
<script nonce="{{NONCE}}">
const vscode=acquireVsCodeApi();const mascot=document.getElementById('mascot');const message=document.getElementById('message');
let currentState;let animationTimeout=null;
const ACTIONS={drink:['Nice sip!','drink'],feed:['Yummy!','feed'],play:['So fun!','play'],rest:['Zzz...','rest']};
const FACE={drink:'happy',feed:'happy',play:'happy',rest:'sleep',wave:'happy',cheer:'happy',dance:'happy',worried:'sad',cry:'cry'};
const IDLE_FACE={proud:'happy',sleepy:'sleep',thirsty:'sad',lonely:'cry'};
const REACT={save:['Saved!','wave'],taskPass:['Build passed!','cheer'],taskFail:['Uh oh, it failed...','cry'],commit:['Commit! Yay!','dance'],errors:['So many errors...','worried'],fixed:['All fixed!','cheer']};
function idle(s){
 if(s.total>=s.goal)return['Goal complete!','proud'];
 if(s.pet.happiness<15)return['Sippy misses you...','lonely'];
 if(s.late)return["It's late, sleep soon?",'sleepy'];
 if(s.mood==='thirsty')return['A bit thirsty...','thirsty'];
 if(s.pet.energy<20)return['Sleepy!','sleepy'];
 if(s.pet.hunger<20)return['Hungry!',''];
 return['Ready to play!',''];
}
const breath=document.getElementById('breath');
const moodTag=document.getElementById('moodTag');
function setFace(f){mascot.dataset.face=f;if(f!=='blink')moodTag.dataset.face=f;if(f!=='blink')breath.dataset.breath=f==='sleep'?'sleep':f==='cry'?'sob':'calm';}
function showIdle(){animationTimeout=null;if(!currentState)return;const[text,cls]=idle(currentState);message.textContent=text;mascot.className=cls?'mascot '+cls:'mascot';setFace(IDLE_FACE[cls]||'open');}
// Blink every few seconds while eyes are open (sometimes a double blink).
function blinkLoop(){setTimeout(()=>{if(mascot.dataset.face==='open'){setFace('blink');setTimeout(()=>{if(mascot.dataset.face==='blink')setFace('open');if(Math.random()<.25)setTimeout(()=>{if(mascot.dataset.face==='open'){setFace('blink');setTimeout(()=>{if(mascot.dataset.face==='blink')setFace('open')},130)}},180)},130)}blinkLoop()},2500+Math.random()*3500)}
blinkLoop();
function play(text,kind){clearTimeout(animationTimeout);message.textContent=text;mascot.className='mascot';void mascot.offsetWidth;mascot.classList.add(kind);setFace(FACE[kind]||'open');animationTimeout=setTimeout(showIdle,2300);}
// Bar geometry in % of egg width: left edge, then right edge after 1..4 segments.
const BARS={heart:[31.95,[36.39,40.09,44.08,49.26]],water:[61.24,[65.24,68.93,72.78,77.81]]};
function setBar(id,[left,edges],n){const right=n?edges[n-1]:left;document.getElementById(id).style.clipPath=`inset(0 ${(100-right).toFixed(2)}% 0 ${left}%)`;}
function update(s){currentState=s;const complete=s.total>=s.goal;
 setBar('waterBar',BARS.water,complete?4:s.total<=0?0:Math.min(3,Math.ceil(s.total/s.goal*4)));
 setBar('heartBar',BARS.heart,Math.max(0,Math.min(4,Math.ceil(s.pet.health/25))));
 document.getElementById('intake').textContent=`${s.total.toLocaleString()}/${s.goal.toLocaleString()} ml`;
 const m=document.getElementById('meter');m.setAttribute('aria-valuemax',String(s.goal));m.setAttribute('aria-valuenow',String(s.total));
 document.getElementById('fill').style.width=Math.min(100,s.total/s.goal*100)+'%';
 document.querySelector('.egg').title=`Health ${s.pet.health}% (hunger ${s.pet.hunger}, happiness ${s.pet.happiness}, energy ${s.pet.energy}) · Water ${Math.round(s.total/s.goal*100)}%`;
 document.getElementById('drink').disabled=complete;
}
const FOODS={fish:['🐟','fish'],shrimp:['🦐','shrimp'],icecream:['🍦','ice cream']};
const snack=document.getElementById('snack');
function showSnack(icon){snack.textContent=icon;snack.className='snack';void snack.offsetWidth;snack.classList.add('eat');}
function render(s,action){update(s);const[act,food]=String(action||'').split(':');
 if(act==='feed'&&FOODS[food]){play(`Yum, ${FOODS[food][1]}!`,'feed');showSnack(FOODS[food][0]);}
 else if(ACTIONS[act])play(...ACTIONS[act]);else if(animationTimeout===null)showIdle();}
window.addEventListener('message',e=>{const d=e.data;if(!d)return;if(d.type==='state')render(d.state,d.animation);if(d.type==='react'&&REACT[d.kind]){update(d.state);play(...REACT[d.kind])}});
const feedBtn=document.getElementById('feed');const foodMenu=document.getElementById('foodMenu');let menuTimer;
function setMenu(open){foodMenu.hidden=!open;feedBtn.setAttribute('aria-expanded',String(open));clearTimeout(menuTimer);
 if(open){message.textContent='Pick a snack!';foodMenu.querySelector('button').focus();menuTimer=setTimeout(()=>setMenu(false),8000);}}
feedBtn.addEventListener('click',e=>{e.stopPropagation();setMenu(foodMenu.hidden);});
for(const b of foodMenu.querySelectorAll('button'))b.addEventListener('click',e=>{e.stopPropagation();setMenu(false);vscode.postMessage({type:'care',action:'feed',food:b.dataset.food});});
document.addEventListener('click',e=>{if(!foodMenu.hidden&&!foodMenu.contains(e.target))setMenu(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!foodMenu.hidden){setMenu(false);feedBtn.focus();}});
for(const id of ['play','rest'])document.getElementById(id).addEventListener('click',()=>vscode.postMessage({type:'care',action:id}));
document.getElementById('drink').addEventListener('click',()=>vscode.postMessage({type:'drink',amount:250}));
function wave(){play('Hello!','wave')}
mascot.addEventListener('click',wave);mascot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();wave()}});
vscode.postMessage({type:'ready'});
</script></body></html>
